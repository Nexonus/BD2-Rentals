{% extends "wypozyczalnia/base.html" %}

{% block title %}Logowanie{% endblock %}

{% block content %}

<div class="container mt-5">
    <form method="post" class="card mx-auto col-6 p-3 shadow-sm">
        <h2>Zaloguj się</h2>

        {% csrf_token %}

        {{ form }}

        <button type="submit">Zaloguj się</button>

        <p>Nie masz konta? <a href="{% url 'wypozyczalnia:rejestracja' %}">Zarejestruj się</a></p>
    </form>
</div>

{% endblock content %}
